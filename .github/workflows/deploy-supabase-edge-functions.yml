# Deploy Supabase Edge Functions when supabase/ changes.
# Required repo secrets:
#   SUPABASE_ACCESS_TOKEN — https://supabase.com/dashboard/account/tokens
#   SUPABASE_PROJECT_REF   — Project Settings → General → Reference ID (e.g. ftpifgzzfwpujlvbqqhu)

name: Deploy Supabase Edge Functions

# Manual run until repo secrets are set (avoid failing every push).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v2
        with:
          version: 2.49.6

      - name: Deploy functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ] || [ -z "${SUPABASE_PROJECT_REF:-}" ]; then
            echo "Add secrets SUPABASE_ACCESS_TOKEN and SUPABASE_PROJECT_REF to run this workflow." >&2
            exit 1
          fi
          supabase functions deploy --project-ref "$SUPABASE_PROJECT_REF"
