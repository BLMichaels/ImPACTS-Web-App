# Supabase project config (CLI / deploy).
# JWT verification at the gateway breaks browser CORS preflight (OPTIONS has no Authorization).
# These functions validate auth inside Deno instead.
#
# IMPORTANT: [auth] mirrors PRODUCTION hosted settings (not local dev defaults).
# Push: npx supabase config push --project-ref ftpifgzzfwpujlvbqqhu --yes

[auth]
enabled = true
site_url = "https://impacts-tau.vercel.app/"
additional_redirect_urls = ["https://impacts-tau.vercel.app/", "https://impacts-tau.vercel.app/account"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
enable_manual_linking = false
minimum_password_length = 15
password_requirements = ""

[auth.mfa]
max_enrolled_factors = 10

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = true
max_frequency = "1m0s"
otp_length = 8
otp_expiry = 3600

[functions.provision-crm-portal-user]
verify_jwt = false

[functions.complete-invitation-registration]
verify_jwt = false

[functions.send-invitation-email]
verify_jwt = false

[functions.sync-portal-login-email]
verify_jwt = false
